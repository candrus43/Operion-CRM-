<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Offline — Operion CRM</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
      }
      body {
        background: #08080a;
        color: #fafafa;
        font-family:
          "Inter",
          ui-sans-serif,
          system-ui,
          -apple-system,
          "Segoe UI",
          Roboto,
          sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1.5rem;
        -webkit-font-smoothing: antialiased;
      }
      .card {
        width: 100%;
        max-width: 24rem;
        background: linear-gradient(
          158deg,
          rgba(255, 255, 255, 0.08) 0%,
          rgba(255, 255, 255, 0.025) 100%
        );
        border: 1px solid rgba(255, 255, 255, 0.09);
        box-shadow: inset 0 1px rgba(255, 255, 255, 0.06);
        border-radius: 1.5rem;
        padding: 2.25rem 2rem;
        text-align: center;
      }
      .mark {
        width: 3rem;
        height: 3rem;
        border-radius: 0.75rem;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(
          135deg,
          rgba(255, 255, 255, 0.08) 0%,
          transparent 100%
        );
        border: 1px solid rgba(255, 255, 255, 0.07);
      }
      .mark img {
        width: 1.75rem;
        height: 1.75rem;
      }
      h1 {
        margin-top: 1.1rem;
        font-size: 1.25rem;
        font-weight: 600;
        letter-spacing: -0.03em;
      }
      p {
        margin-top: 0.5rem;
        font-size: 0.85rem;
        line-height: 1.6;
        color: #9b9ba4;
      }
      button {
        margin-top: 1.5rem;
        height: 2.75rem;
        padding: 0 1.5rem;
        border: 0;
        border-radius: 999px;
        background: #fff;
        color: #000;
        font-size: 0.875rem;
        font-weight: 500;
        cursor: pointer;
      }
      button:active {
        opacity: 0.85;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="mark"><img src="/logo.png" alt="" /></div>
      <h1>You're offline</h1>
      <p>
        Operion CRM needs a connection to load your workspace. Check your
        connection and try again.
      </p>
      <button type="button" onclick="location.reload()">Retry</button>
    </div>
  </body>
</html>
